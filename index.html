<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   1. 빛의 물리 — 파장별 굴절률, 색, 광선 추적
   ========================================================= */
const NL = 48;              // 파장 표본 수
const NU = 15, NV = 5;      // 광선 다발 격자 (가로 폭 × 세로 높이)
const LAMBDA = Array.from({length: NL}, (_, i) => 400 + 300 * (i + 0.5) / NL);
const IU_MID = (NU - 1) >> 1, IV_MID = (NV - 1) >> 1;

// CIE 1931 등색함수 (Wyman·Sloan·Shirley 근사) → 선형 sRGB
function gpk(x, m, s1, s2){ const t = (x - m) / (x < m ? s1 : s2); return Math.exp(-0.5 * t * t); }
function cie(l){
  return [
    1.056*gpk(l,599.8,37.9,31.0) + 0.362*gpk(l,442.0,16.0,26.7) - 0.065*gpk(l,501.1,20.4,26.2),
    0.821*gpk(l,568.8,46.9,40.5) + 0.286*gpk(l,530.9,16.3,31.1),
    1.217*gpk(l,437.0,11.8,36.0) + 0.681*gpk(l,459.0,26.0,13.8)
  ];
}
const SPEC = LAMBDA.map(l => {
  const [X, Y, Z] = cie(l);
  return [
    Math.max(0,  3.2406*X - 1.5372*Y - 0.4986*Z),
    Math.max(0, -0.9689*X + 1.8758*Y + 0.0415*Z),
    Math.max(0,  0.0557*X - 0.2040*Y + 1.0570*Z)
  ];
});
{ // 모든 파장을 더하면 흰빛(1,1,1)이 되도록 맞춤
  const s = [0,0,0]; SPEC.forEach(c => { s[0]+=c[0]; s[1]+=c[1]; s[2]+=c[2]; });
  SPEC.forEach(c => { c[0]/=s[0]; c[1]/=s[1]; c[2]/=s[2]; });
}
// 먼지에 비칠 때 쓰는 '순수한 색' (밝기 정규화)
const HUE = SPEC.map(c => { const m = Math.max(c[0], c[1], c[2]) || 1; return [c[0]/m, c[1]/m, c[2]/m]; });

// 셀마이어 분산식 (λ: µm)
const GLASS = {
  crown:   { B:[1.03961212, 0.231792344, 1.01046945], C:[0.00600069867, 0.0200179144, 103.560653], disp: 1.2, tint: 0xffffff },
  flint:   { B:[1.34533359, 0.209073176, 0.937357162], C:[0.00997743871, 0.0470450767, 111.886764], disp: 3.0, tint: 0xfffcf6 },
  diamond: { B:[4.3356, 0.3306, 0],                    C:[0.1060*0.1060, 0.1750*0.1750, 1],      disp: 6.0, tint: 0xffffff },
};
function sellmeier(g, lnm){
  const l2 = (lnm/1000) ** 2;
  let s = 1; for (let k = 0; k < 3; k++) s += g.B[k] * l2 / (l2 - g.C[k]);
  return Math.sqrt(s);
}

// 시간대
const SUNS = {
  morning: { e: 22, col: [1.00, 0.80, 0.58], E: 8.5, amb: 0.42, sky: [1.0, 0.86, 0.70] },
  noon:    { e: 28, col: [1.00, 0.97, 0.92], E: 9.0, amb: 0.50, sky: [1.0, 0.98, 0.95] },
  evening: { e: 17, col: [1.00, 0.55, 0.26], E: 8.0, amb: 0.30, sky: [1.0, 0.58, 0.32] },
};
const SUN_AZ = 0.24;                 // 햇빛의 수평 방향 (방 안쪽 → 약간 관찰자 쪽)
const HORIZ = 1.45;                  // 덧창 틈 ~ 프리즘 수평 거리
// 방
const X0 = -3, X1 = 3, Z0 = -3.2, Z1 = 2.2, H = 2.9;
const SHUT_X = X0 + 0.1;             // 덧창 안쪽 면
const PC = [-1.5, 0.95, -1.2];       // 프리즘 중심
const HOLE = [SHUT_X, 1.6, PC[2] - (PC[0] - SHUT_X) * Math.tan(SUN_AZ)];   // 덧창 틈 (높이는 해에 따라)
// 프리즘 (정삼각 기둥)
const PS = 0.14, PL = 0.34;
const INR = PS / (2 * Math.sqrt(3));
const BEAM_W = 0.026, BEAM_H = 0.25; // 덧창 틈으로 들어오는 빛다발 단면
const SUN_DISK = 0.0093;             // 태양 시지름 (rad)

// --- 작은 벡터 도구 (배열) ---
const dot = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const madd = (a,b,s) => [a[0]+b[0]*s, a[1]+b[1]*s, a[2]+b[2]*s];
const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const nrm = a => { const l = len(a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

function sunDir(eDeg){
  const e = eDeg * Math.PI / 180;
  return [Math.cos(e)*Math.cos(SUN_AZ), -Math.sin(e), Math.cos(e)*Math.sin(SUN_AZ)];
}
function prismCenter(){ return PC.slice(); }
function holeY(eDeg){ return PC[1] + (PC[0] - SHUT_X) / Math.cos(SUN_AZ) * Math.tan(eDeg * Math.PI / 180); }

// 프리즘 면: 로컬 좌표에서 꼭짓점이 +y(90°), 면의 바깥 법선 270°·30°·150°, 양 끝면 ±z
const C30 = Math.cos(Math.PI/6), S30 = 0.5;
const LOCAL_PLANES = [[0,-1,0,INR], [C30,S30,0,INR], [-C30,S30,0,INR], [0,0,1,PL/2], [0,0,-1,PL/2]];
const _v = new THREE.Vector3();
function prismPlanes(C, q){
  return LOCAL_PLANES.map(([x,y,z,dd]) => {
    _v.set(x,y,z).applyQuaternion(q);
    const n = [_v.x, _v.y, _v.z];
    return { n, d: dd + dot(n, C) };
  });
}

function fresnel(cosi, cost, n1, n2){
  const rs = (n1*cosi - n2*cost) / (n1*cosi + n2*cost);
  const rp = (n1*cost - n2*cosi) / (n1*cost + n2*cosi);
  return 0.5 * (rs*rs + rp*rp);
}
function roomExit(p, d){
  let t = 1e9;
  if (d[0] > 1e-9) t = Math.min(t, (X1 - p[0]) / d[0]); else if (d[0] < -1e-9) t = Math.min(t, (X0 - p[0]) / d[0]);
  if (d[1] > 1e-9) t = Math.min(t, (H  - p[1]) / d[1]); else if (d[1] < -1e-9) t = Math.min(t, (0  - p[1]) / d[1]);
  if (d[2] > 1e-9) t = Math.min(t, (Z1 - p[2]) / d[2]); else if (d[2] < -1e-9) t = Math.min(t, (Z0 - p[2]) / d[2]);
  return Math.max(0, t);
}
function enterPrism(p, d, planes){
  let tN = -1e9, tF = 1e9, face = -1;
  for (let i = 0; i < planes.length; i++){
    const P = planes[i], nd = dot(P.n, d), dist = P.d - dot(P.n, p);
    if (Math.abs(nd) < 1e-12){ if (dist < 0) return null; continue; }
    const t = dist / nd;
    if (nd < 0){ if (t > tN){ tN = t; face = i; } }
    else if (t < tF) tF = t;
  }
  if (tN > tF || tN < 1e-7) return null;
  return { t: tN, face };
}

// 광선 하나를 방 안에서 추적: 공기 중 구간, 투과율, 경로 서명, 입사면 반사광
function trace(o, d, nG, prisms){
  let p = o, dir = d, T = 1, sig = '', refl = null, refr = 0;
  const segs = [], gsegs = [];
  for (let pass = 0; pass < 4; pass++){
    let best = null, bk = -1;
    for (let k = 0; k < prisms.length; k++){
      const h = enterPrism(p, dir, prisms[k].planes);
      if (h && (!best || h.t < best.t)){ best = h; bk = k; }
    }
    if (!best) break;
    const planes = prisms[bk].planes;
    const hit = madd(p, dir, best.t);
    segs.push([p, hit]);
    // 들어갈 때 굴절
    const N = planes[best.face].n;
    const cosi = -dot(dir, N), eta = 1 / nG;
    const k2 = 1 - eta*eta*(1 - cosi*cosi), cost = Math.sqrt(k2);
    const R = fresnel(cosi, cost, 1, nG);
    if (pass === 0) refl = { p: hit, d: madd(dir, N, 2*cosi), R, face: best.face };
    T *= 1 - R;
    dir = nrm(madd(dir.map(x => x*eta), N, eta*cosi - cost));
    sig += bk + '' + best.face;
    p = hit;
    const gStart = hit;
    // 유리 안에서 나갈 면 찾기 (전반사 포함)
    let out = false;
    for (let b = 0; b < 9; b++){
      let tm = 1e9, f = -1;
      for (let i = 0; i < planes.length; i++){
        const nd = dot(planes[i].n, dir);
        if (nd > 1e-9){ const t = (planes[i].d - dot(planes[i].n, p)) / nd; if (t < tm){ tm = t; f = i; } }
      }
      if (f < 0) return null;
      const n = planes[f].n;
      p = madd(p, dir, tm);
      const ci = dot(dir, n), k3 = 1 - nG*nG*(1 - ci*ci);
      sig += f;
      if (k3 < 0){ dir = madd(dir, n, -2*ci); sig += 'r'; continue; }   // 전반사
      const ct = Math.sqrt(k3);
      T *= 1 - fresnel(ci, ct, nG, 1);
      dir = nrm(madd(dir.map(x => x*nG), n, -(nG*ci - ct)));
      out = true; refr++; break;
    }
    if (!out) return null;
    gsegs.push([gStart, p]);
    sig += '|';
  }
  const t = roomExit(p, dir);
  segs.push([p, madd(p, dir, t)]);
  return { segs, gsegs, T, sig, fo: p, fd: dir, refl, refr };
}

      if (!r) continue;
      const dv = Math.acos(Math.min(1, dot(d0, r.fd)));
      if (devMin === null || dv < devMin){ devMin = dv; bestYaw = a; bestFace = f; }
    }
  }
  // 처음 자리: 최소 편각에서 살짝 비켜 서고, 빛다발 전체가 한 면으로 들어가는 쪽
  homeOff = 0;
  for (const off of [0.1, -0.1, 0.07, -0.07, 0.04, -0.04]){
    if (faceRay(bestYaw + off, bestFace, 0) && faceRay(bestYaw + off, bestFace, BEAM_W*0.6) && faceRay(bestYaw + off, bestFace, -BEAM_W*0.6)){ homeOff = off; break; }
  }
  // 그 면의 한가운데가 빛다발 중심에 오도록 받침을 옮겨 둠
  orient(bestYaw + homeOff, 0, qq);
  {
    const n = prismPlanes(C1, qq)[bestFace].n;
    const Fc = madd(C1, n, INR);
    C1 = madd(C1, eu, -dot(sub(Fc, PC), eu));
  }
  return bestYaw;
}

const rays = [];            // [λ][iu*NV+iv]
let reflRays = [];
const surfUV = (r, s) => {  // 광선의 마지막 구간이 면에 닿는 uv
  const den = dot(r.fd, s.n);
  if (den > -1e-6) return null;
  const t = dot(sub(s.o, r.fo), s.n) / den;
  if (t <= 0) return null;
  const p = madd(r.fo, r.fd, t), q = sub(p, s.o);
  return [dot(q, s.U)/s.UU, dot(q, s.V)/s.VV];
};
let beams = [];             // 먼지용 빛다발
let devNow = null;
let interest = { min:[X0,0,Z0], max:[X1,H,Z1] };

function compute(){
  const S = SUNS[state.time];
  orient(yaw, tilt, q1);
  const prisms = [{ planes: prismPlanes(C1, q1) }];
  placeHolder(holders[0], C1, q1);

  // 중심 광선 (편각 표시 · 뉴턴 프리즘 자리)
  const n550 = sellmeier(GLASS[state.glass], 550);
  const rc = trace(madd(PC, d0, -1), d0, n550, prisms);
  devNow = (rc && rc.sig.length === 4 && !rc.sig.includes('r')) ? Math.acos(Math.min(1, dot(d0, rc.fd))) : null;
  holders[1].grp.visible = false;
  if (state.newton && rc && rc.refr === 1){
    const C2 = madd(rc.fo, rc.fd, 0.26);
    const q2 = q1.clone().multiply(_q2.setFromAxisAngle(new THREE.Vector3(0,0,1), Math.PI));
    prisms.push({ planes: prismPlanes(C2, q2) });
    placeHolder(holders[1], C2, q2);
    holders[1].grp.visible = true;
  }

  // 광선 다발 출발점 (덧창 틈)
  const origins = [];
  for (let iu = 0; iu < NU; iu++) for (let iv = 0; iv < NV; iv++){
    const u = (iu/(NU-1) - 0.5) * BEAM_W, v = (iv/(NV-1) - 0.5) * BEAM_H;
    const Q = madd(madd(PC, eu, u), ev, v);
    origins.push(madd(Q, d0, -(Q[0] - SHUT_X) / d0[0]));
  }
  // 파장마다 추적 (태양 원반 크기만큼 방향을 조금씩 흩뜨림)
  for (let i = 0; i < NL; i++){
    const a = ((i * 29) % NL) / NL - 0.5, b = ((i * 17 + 7) % NL) / NL - 0.5;
    const di = nrm(madd(madd(d0, eu, a*SUN_DISK), ev, b*SUN_DISK));
    const arr = rays[i] || (rays[i] = []);
    for (let k = 0; k < origins.length; k++) arr[k] = trace(origins[k], di, nG[i], prisms);
  }
  // 입사면에서 반사된 흰빛
  reflRays = rays[NL >> 1].map(r => (r && r.refl) ? { fo: r.refl.p, fd: r.refl.d, T: r.refl.R, sig: 'R' + r.refl.face } : null);

  buildLightmaps(S);
  buildRibbons(S);
}

function buildLightmaps(S){
  const cellA = (BEAM_W/(NU-1)) * (BEAM_H/(NV-1));
  for (const s of surfaces) s.cnt = 0;
  const E = S.E;
  const sets = [];
  for (let i = 0; i < NL; i++) sets.push([rays[i], SPEC[i]]);
  sets.push([reflRays, [1,1,1]]);
  for (const [arr, c] of sets){
    const cache = new Map();
    for (let iu = 0; iu < NU-1; iu++) for (let iv = 0; iv < NV-1; iv++){
      const ks = [iu*NV+iv, (iu+1)*NV+iv, (iu+1)*NV+iv+1, iu*NV+iv+1];
      const rr = ks.map(k => arr[k]);
      if (rr.some(r => !r)) continue;
      const sg = rr[0].sig;
      if (rr[1].sig !== sg || rr[2].sig !== sg || rr[3].sig !== sg) continue;
      const T = 0.25 * (rr[0].T + rr[1].T + rr[2].T + rr[3].T);
      if (T < 1e-4) continue;
      for (let si = 0; si < surfaces.length; si++){
        const s = surfaces[si];
        const uv = [];
        for (let j = 0; j < 4; j++){
          const key = ks[j]*8 + si;
          let v = cache.get(key);
          if (v === undefined){ v = surfUV(rr[j], s); cache.set(key, v); }
          if (!v) break;
          uv.push(v);
        }
        if (uv.length < 4) continue;
        // 바깥이면 건너뜀
        let minU = 9, maxU = -9, minV = 9, maxV = -9;
        for (const p of uv){ minU = Math.min(minU,p[0]); maxU = Math.max(maxU,p[0]); minV = Math.min(minV,p[1]); maxV = Math.max(maxV,p[1]); }
        if (maxU < 0 || minU > 1 || maxV < 0 || minV > 1) continue;
        let ar = 0;
        for (let j = 0; j < 4; j++){ const p = uv[j], q = uv[(j+1)%4]; ar += p[0]*q[1] - q[0]*p[1]; }
        ar = Math.abs(ar) * 0.5 * s.area;
        const f = Math.min(70, cellA * T / Math.max(ar, 1e-9)) * E;
        const cr = c[0]*S.col[0]*f, cg = c[1]*S.col[1]*f, cb = c[2]*S.col[2]*f;
        if (s.cnt >= MAXQ) continue;
        const o = s.cnt * 18;
        const tri = [uv[0], uv[1], uv[2], uv[0], uv[2], uv[3]];
        for (let j = 0; j < 6; j++){
          s.pos[o+j*3] = tri[j][0]; s.pos[o+j*3+1] = tri[j][1]; s.pos[o+j*3+2] = 0;
          s.col[o+j*3] = cr; s.col[o+j*3+1] = cg; s.col[o+j*3+2] = cb;
        }
        s.cnt++;
      }
    }
  }
  for (const s of surfaces){
    s.lg.attributes.position.needsUpdate = true;
    s.lg.attributes.color.needsUpdate = true;
    s.lg.setDrawRange(0, s.cnt * 6);
  }
}

let ribCount = 0;
function pushSheet(A0, A1, B0, B1, cA, cB){  // A: 가장자리 0 (시작·끝), B: 가장자리 1
  if (ribCount >= MAXSHEET) return;
  const o = ribCount * 6;
  const P = [A0, B0, B1, A0, B1, A1], AC = [0,1,1,0,1,0], CC = [cA, cA, cB, cA, cB, cB];
  for (let j = 0; j < 6; j++){
    ribPos.set(P[j], (o+j)*3); ribCol.set(CC[j], (o+j)*3); ribAcr[o+j] = AC[j];
  }
  ribCount++;
}
function buildRibbons(S){
  ribCount = 0; beams = [];
  const lo = [9,9,9], hi = [-9,-9,-9];
  const grow = p => { for (let a = 0; a < 3; a++){ lo[a] = Math.min(lo[a], p[a]); hi[a] = Math.max(hi[a], p[a]); } };
  const STEP = 2, AIR = 0.05;
  for (let i = 0; i < NL; i++){
    const arr = rays[i];
    const center = i === (NL >> 1);
    if (!center && i % STEP) continue;
    // 가로 방향으로 같은 길을 가는 광선끼리 묶음 (빛이 모서리에 걸치면 갈라짐)
    let iu = 0;
    while (iu < NU){
      const r0 = arr[iu*NV + IV_MID];
      if (!r0){ iu++; continue; }
      let j = iu;
      while (j + 1 < NU && arr[(j+1)*NV + IV_MID] && arr[(j+1)*NV + IV_MID].sig === r0.sig) j++;
      if (j > iu){
        const ua = r0, ub = arr[j*NV + IV_MID], m = (iu + j) >> 1;
        const va = arr[m*NV], vb = arr[m*NV + NV - 1];
        const vOK = va && vb && va.sig === r0.sig && vb.sig === r0.sig;
        const w0 = BEAM_W * (j - iu) / (NU - 1);
        for (let k = 0; k < ua.segs.length; k++){
          const incoming = k === 0;
          if (incoming !== center && incoming) continue;
          if (!incoming && i % STEP) continue;
          const [A0, A1] = ua.segs[k], [B0, B1] = ub.segs[k];
          const ws = len(sub(B0, A0)), we = len(sub(B1, A1));
          let cA, cB, hue;
          if (incoming){
            const g = S.E * AIR * 0.8 * (j - iu) / (NU - 1);
            cA = cB = [S.col[0]*g, S.col[1]*g, S.col[2]*g];
            hue = S.col;
          } else {
            const c = SPEC[i], g = S.E * AIR * STEP;
            const fa = Math.min(4, w0 / Math.max(ws, 1e-4)) * g, fb = Math.min(4, w0 / Math.max(we, 1e-4)) * g;
            cA = [c[0]*S.col[0]*fa, c[1]*S.col[1]*fa, c[2]*S.col[2]*fa];
            cB = [c[0]*S.col[0]*fb, c[1]*S.col[1]*fb, c[2]*S.col[2]*fb];
            hue = [HUE[i][0]*S.col[0], HUE[i][1]*S.col[1], HUE[i][2]*S.col[2]];
          }
          pushSheet(A0, A1, B0, B1, cA, cB);
          if (center && ua.gsegs[k] && ub.gsegs[k]){   // 유리 속을 지나는 빛 (살짝 비침)
            const gl = S.E * 0.05 * (j - iu) / (NU - 1), gc = [S.col[0]*gl, S.col[1]*gl, S.col[2]*gl];
            pushSheet(ua.gsegs[k][0], ua.gsegs[k][1], ub.gsegs[k][0], ub.gsegs[k][1], gc, gc);
            if (vOK && va.gsegs[k] && vb.gsegs[k]) pushSheet(va.gsegs[k][0], va.gsegs[k][1], vb.gsegs[k][0], vb.gsegs[k][1], gc, gc);
          }
          if (vOK && va.segs[k] && vb.segs[k]){
            pushSheet(va.segs[k][0], va.segs[k][1], vb.segs[k][0], vb.segs[k][1], cA, cB);
            if (incoming || i % 4 === 0){
              const V0 = sub(vb.segs[k][0], va.segs[k][0]), V1 = sub(vb.segs[k][1], va.segs[k][1]);
              const Sx = [(A0[0]+B0[0])/2, (A0[1]+B0[1])/2, (A0[2]+B0[2])/2];
              const Ex = [(A1[0]+B1[0])/2, (A1[1]+B1[1])/2, (A1[2]+B1[2])/2];
              const D = sub(Ex, Sx), DD = dot(D, D);
              if (DD > 1e-6){
                beams.push({ S: Sx, D, DD, U0: sub(B0, A0), U1: sub(B1, A1), V0, V1, ws, hue, w: incoming ? 1.1 : 0.55 });
                const L = Math.sqrt(DD), cut = Math.min(1, 2.6 / L);
                grow(Sx); grow(madd(Sx, D, cut));
              }
            }
          }
        }
      }
      iu = j + 1;
    }
  }
  for (let a = 0; a < 3; a++){ lo[a] -= 0.18; hi[a] += 0.18; }
  lo[0] = Math.max(lo[0], SHUT_X); lo[1] = Math.max(lo[1], 0); hi[1] = Math.min(hi[1], H);
  if (lo[0] < hi[0]) interest = { min: lo, max: hi };
  ribGeo.attributes.position.needsUpdate = true;
  ribGeo.attributes.color.needsUpdate = true;
  ribGeo.attributes.across.needsUpdate = true;
  ribGeo.setDrawRange(0, ribCount * 6);
}

// 먼지 움직임과 빛
const drng = rng(42);
function respawn(i){
  const { min, max } = interest;
  dPos[i*3]   = min[0] + drng()*(max[0]-min[0]);
  dPos[i*3+1] = min[1] + drng()*(max[1]-min[1]);
  dPos[i*3+2] = min[2] + drng()*(max[2]-min[2]);
  dLife[i] = 4 + drng()*10;
  dVel[i*3] = (drng()-0.5)*0.01; dVel[i*3+1] = (drng()-0.4)*0.008; dVel[i*3+2] = (drng()-0.5)*0.01;
}
for (let i = 0; i < NDUST; i++){ respawn(i); dLife[i] *= drng(); }
let dustT = 0;
function updateDust(dt){
  dustT += dt;
  for (let i = 0; i < NDUST; i++){
    dLife[i] -= dt;
    if (dLife[i] <= 0){ respawn(i); continue; }
    const j = i*3;
    dVel[j]   += (Math.sin(dustT*0.31 + i) * 0.004 - dVel[j]) * dt * 0.5;
    dVel[j+1] += (Math.cos(dustT*0.23 + i*1.7) * 0.003 - dVel[j+1]) * dt * 0.5;
    dVel[j+2] += (Math.sin(dustT*0.27 + i*2.3) * 0.004 - dVel[j+2]) * dt * 0.5;
    dPos[j] += dVel[j]*dt*3; dPos[j+1] += dVel[j+1]*dt*3; dPos[j+2] += dVel[j+2]*dt*3;
    // 빛을 받는지
    let r = 0, g = 0, b = 0;
    const p = [dPos[j], dPos[j+1], dPos[j+2]];
    for (const B of beams){
      const q = sub(p, B.S), t = dot(q, B.D) / B.DD;
      if (t < 0 || t > 1) continue;
      const off = madd(q, B.D, -t);
      const U = madd(B.U0, sub(B.U1, B.U0), t), Vv = madd(B.V0, sub(B.V1, B.V0), t);
      const UU = dot(U,U), VV = dot(Vv,Vv);
      if (UU < 1e-10 || VV < 1e-10) continue;
      const a = dot(off, U) / UU, c = dot(off, Vv) / VV;
      if (Math.abs(a) > 0.5 || Math.abs(c) > 0.5) continue;
      const fall = Math.cos(a * Math.PI) * (1 - 0.6*Math.abs(c)*2);
      const k = B.w * fall * Math.min(3, B.ws / Math.sqrt(UU));
      r += B.hue[0]*k; g += B.hue[1]*k; b += B.hue[2]*k;
    }
    const tw = 0.75 + 0.25 * Math.sin(dustT * 2.1 + i * 3.7);
    dCol[j] = r*tw; dCol[j+1] = g*tw; dCol[j+2] = b*tw;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.color.needsUpdate = true;
}

/* =========================================================
   4. 화면, 카메라, 렌더링
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.32, 0.55, 1.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const CAM_TGT = new THREE.Vector3(-1.2, 0.55, -1.95);
let fitCamera = function(){
  const w = window.innerWidth, h = window.innerHeight, asp = w / h;
  camera.aspect = asp;
  const portrait = asp < 0.85;
  const dir = (portrait ? new THREE.Vector3(3.0, 2.3, 0.35) : new THREE.Vector3(2.6, 1.45, 2.0)).normalize();
  const dist = portrait ? 3.3 : 2.7;
  const tgt = CAM_TGT.clone();
  if (portrait) tgt.set(-1.3, 0.6, -2.1);
  camera.position.copy(tgt).addScaledVector(dir, dist);
  camera.lookAt(tgt);
  camera.updateMatrixWorld();
  const C = prismCenter();
  const pts = [
    [HOLE[0], HOLE[1] + 0.2, HOLE[2]], [C[0], C[1] + 0.2, C[2]], [C[0], 0, C[2]],
    [-0.1, 0, -2.8], [-0.9, 0, -3.0], [0.2, 0, -2.2]
  ];
  const inv = camera.matrixWorldInverse;
  let need = 0.2;
  for (const p of pts){
    const v = new THREE.Vector3(...p).applyMatrix4(inv);
    const z = -v.z; if (z <= 0.1) continue;
    need = Math.max(need, Math.abs(v.y) / z, Math.abs(v.x) / z / asp);
  }
  camera.fov = Math.min(80, THREE.MathUtils.radToDeg(2 * Math.atan(need / 0.86)));
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  bloom.resolution.set(w * DPR / 2, h * DPR / 2);
}
window.addEventListener('resize', () => { fitCamera(); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCamera);

function renderLightmaps(){
  const prevClear = renderer.getClearColor(new THREE.Color()), prevA = renderer.getClearAlpha();
  renderer.setClearColor(0x000000, 0);
  for (const s of surfaces){
    renderer.setRenderTarget(s.rt);
    renderer.clear(true, false, false);
    if (s.cnt) renderer.render(s.ls, lmCam);
  }
  renderer.setRenderTarget(null);
  renderer.setClearColor(prevClear, prevA);
}

// 편각 표시
const devEl = document.getElementById('dev'), bestEl = document.getElementById('best');
function updateReadout(){
  if (devNow === null || state.newton){
    devEl.innerHTML = state.newton ? '뉴턴의 실험 — 흰빛으로 다시 모였나요?' : '';
    bestEl.classList.remove('on');
    return;
  }
  const d = devNow * 180 / Math.PI;
  devEl.innerHTML = `꺾인 각 <b>${d.toFixed(1)}°</b>` + (devMin !== null ? ` · 가장 작은 각 ${(devMin*180/Math.PI).toFixed(1)}°` : '');
  bestEl.classList.toggle('on', devMin !== null && Math.abs(devNow - devMin) < 0.006 && Math.abs(tilt) < 0.05);
}

/* =========================================================
   5. 조작 — 끌기, 기울이기
   ========================================================= */
let dragging = false, lastX = 0, lastY = 0, lastT = 0, touched = false;
const hint = document.getElementById('hint');
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); vYaw = 0;
  canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  closeDrawer();
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const s = Math.min(window.innerWidth, window.innerHeight);
  const dx = e.clientX - lastX, dy = e.clientY - lastY, now = performance.now();
  const dYaw = dx / s * 2.2;
  dragYaw += dYaw;
  dragTilt = Math.max(-0.45, Math.min(0.45, dragTilt + dy / s * 0.9));
  const dt = Math.max(1, now - lastT);
  vYaw = vYaw * 0.6 + (dYaw / dt * 1000) * 0.4;
  lastX = e.clientX; lastY = e.clientY; lastT = now;
  if (!touched){ touched = true; hint.classList.remove('on'); }
});
const endDrag = e => { if (!dragging) return; dragging = false; canvas.classList.remove('dragging'); if (performance.now() - lastT > 80) vYaw = 0; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

let gyroBase = null;
function screenAngle(){ return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
function onOrient(e){
  if (!state.tilt || e.beta === null) return;
  const a = ((screenAngle() % 360) + 360) % 360;
  let lr, fb;
  if (a === 90){ lr = e.beta; fb = -e.gamma; }
  else if (a === 270){ lr = -e.beta; fb = e.gamma; }
  else { lr = e.gamma; fb = e.beta; }
  if (!gyroBase) gyroBase = { lr, fb };
  gyroYaw = (lr - gyroBase.lr) * Math.PI / 180 * 1.6;
  gyroTilt = Math.max(-0.45, Math.min(0.45, (fb - gyroBase.fb) * Math.PI / 180 * 0.6));
  if (!touched && Math.abs(gyroYaw) > 0.05){ touched = true; hint.classList.remove('on'); }
}
window.addEventListener('deviceorientation', onOrient);
window.addEventListener('orientationchange', () => { gyroBase = null; });
async function enableTilt(on){
  if (on && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    try { const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') on = false; } catch (e) { on = false; }
  }
  state.tilt = on; gyroBase = null;
  if (!on){ dragYaw += gyroYaw; gyroYaw = 0; gyroTilt = 0; }
  togTilt.classList.toggle('on', on);
}

/* =========================================================
   6. 서랍 메뉴
   ========================================================= */
const drawer = document.getElementById('drawer');
const menuBtn = document.getElementById('menuBtn');
const togNewton = document.getElementById('togNewton'), togBeam = document.getElementById('togBeam'), togTilt = document.getElementById('togTilt');
function closeDrawer(){ drawer.classList.remove('open'); }
menuBtn.addEventListener('click', e => { e.stopPropagation(); drawer.classList.toggle('open'); });
function segment(id, key, after){
  const el = document.getElementById(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    state[key] = b.dataset.v; after && after();
  });
}
let homeYaw = 0, homeOff = 0.12;
function resetSun(keepRelative){
  const rel = yaw - homeYaw;
  homeYaw = setupSun();
  if (keepRelative){ dragYaw = homeYaw + rel - gyroYaw; yaw = yawT = homeYaw + rel; }
  dirty = true;
}
segment('segTime', 'time', () => { resetSun(true); fitCamera(); });
segment('segGlass', 'glass', () => { resetSun(true); });
togNewton.addEventListener('click', () => { state.newton = !state.newton; togNewton.classList.toggle('on', state.newton); dirty = true; });
togBeam.addEventListener('click', () => { state.beams = !state.beams; togBeam.classList.toggle('on', state.beams); ribbons.visible = dust.visible = state.beams; });
togTilt.addEventListener('click', () => enableTilt(!state.tilt));
if (!('DeviceOrientationEvent' in window) || !matchMedia('(pointer:coarse)').matches) togTilt.style.display = 'none';
document.getElementById('btnFull').addEventListener('click', async () => {
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) await (d.exitFullscreen ? d.exitFullscreen() : d.webkitExitFullscreen());
    else await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen());
  } catch (e) {}
});
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) document.getElementById('btnFull').style.display = 'none';
document.getElementById('btnReset').addEventListener('click', () => {
  dragYaw = homeYaw + homeOff; dragTilt = 0; gyroBase = null; gyroYaw = 0; gyroTilt = 0; vYaw = 0; dirty = true;
});

/* =========================================================
   7. 시작
   ========================================================= */
homeYaw = setupSun();
dragYaw = yaw = yawT = homeYaw + homeOff;
fitCamera();
compute(); renderLightmaps();
updateReadout();
document.getElementById('loading').textContent = '';

const intro = document.getElementById('intro');
document.getElementById('go').addEventListener('click', async () => {
  intro.classList.add('hide');
  if (matchMedia('(pointer:coarse)').matches && 'DeviceOrientationEvent' in window) await enableTilt(true);
  setTimeout(() => { if (!touched) hint.classList.add('on'); }, 900);
  setTimeout(() => hint.classList.remove('on'), 9000);
});

let prevT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now;
  if (!dragging && Math.abs(vYaw) > 1e-3){ dragYaw += vYaw * dt; vYaw *= Math.pow(0.04, dt); }
  yawT = dragYaw + gyroYaw;
  tiltT = Math.max(-0.5, Math.min(0.5, dragTilt + gyroTilt));
  const k = 1 - Math.pow(0.0005, dt);
  yaw += (yawT - yaw) * k; tilt += (tiltT - tilt) * k;
  if (Math.abs(yaw - lastYaw) > 2e-5 || Math.abs(tilt - lastTilt) > 2e-5) dirty = true;
  if (dirty){
    lastYaw = yaw; lastTilt = tilt; dirty = false;
    compute(); renderLightmaps(); updateReadout();
  }
  if (state.beams) updateDust(dt);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ready = true;
</script>
